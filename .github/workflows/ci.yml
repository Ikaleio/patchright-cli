name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Patchright CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version sync
        run: bun scripts/check-version-sync.js

      - name: Typecheck Patchright daemon
        run: bun run typecheck:patchright

      - name: Build Patchright daemon
        run: bun run build:patchright

      - name: Check Rust formatting
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Build native CLI
        run: cargo build --release --manifest-path cli/Cargo.toml

      - name: Copy native CLI
        run: bun scripts/copy-native.js

      - name: Check CLI version
        run: bun bin/patchright-cli.js --version
