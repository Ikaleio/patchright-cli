name: Publish npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and check the package without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  queue: max

env:
  RELEASE_REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-binaries:
    name: Build ${{ matrix.name }}
    if: >-
      github.repository == 'Ikaleio/patchright-cli' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
        )
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            build-target: x86_64-unknown-linux-gnu.2.28
            binary: agent-browser-linux-x64
            zigbuild: true
          - name: Linux ARM64
            os: ubuntu-24.04
            rust-target: aarch64-unknown-linux-gnu
            build-target: aarch64-unknown-linux-gnu.2.28
            binary: agent-browser-linux-arm64
            zigbuild: true
          - name: Linux musl x64
            os: ubuntu-24.04
            rust-target: x86_64-unknown-linux-musl
            build-target: x86_64-unknown-linux-musl
            binary: agent-browser-linux-musl-x64
            zigbuild: true
          - name: Linux musl ARM64
            os: ubuntu-24.04
            rust-target: aarch64-unknown-linux-musl
            build-target: aarch64-unknown-linux-musl
            binary: agent-browser-linux-musl-arm64
            zigbuild: true
          - name: Windows x64
            os: ubuntu-24.04
            rust-target: x86_64-pc-windows-gnu
            build-target: x86_64-pc-windows-gnu
            binary: agent-browser-win32-x64.exe
            zigbuild: false
          - name: macOS x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            build-target: x86_64-apple-darwin
            binary: agent-browser-darwin-x64
            zigbuild: false
          - name: macOS ARM64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            build-target: aarch64-apple-darwin
            binary: agent-browser-darwin-arm64
            zigbuild: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: npm-${{ matrix.rust-target }}

      - name: Prepare release version
        run: bun scripts/prepare-npm-release.js

      - name: Install Windows linker
        if: matrix.rust-target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - uses: astral-sh/setup-uv@v6
        if: matrix.zigbuild

      - name: Install cross-compilation tools
        if: matrix.zigbuild
        run: |
          uv venv /tmp/prcli-zig
          uv pip install --python /tmp/prcli-zig/bin/python ziglang==0.15.2
          echo 'CARGO_ZIGBUILD_PYTHON_PATH=/tmp/prcli-zig/bin/python' >> "$GITHUB_ENV"
          cargo install cargo-zigbuild --version 0.23.2 --locked

      - name: Build native CLI
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          if [ '${{ matrix.zigbuild }}' = 'true' ]; then
            cargo zigbuild --release --locked --manifest-path cli/Cargo.toml --target '${{ matrix.build-target }}'
          else
            cargo build --release --locked --manifest-path cli/Cargo.toml --target '${{ matrix.rust-target }}'
          fi

      - name: Copy native binary
        run: |
          mkdir -p artifacts
          SOURCE='cli/target/${{ matrix.rust-target }}/release/agent-browser'
          if [ '${{ matrix.rust-target }}' = 'x86_64-pc-windows-gnu' ]; then
            SOURCE="$SOURCE.exe"
          fi
          cp "$SOURCE" 'artifacts/${{ matrix.binary }}'
          chmod +x 'artifacts/${{ matrix.binary }}'

      - name: Check Linux glibc compatibility
        if: endsWith(matrix.rust-target, '-gnu') && matrix.zigbuild
        run: |
          if objdump -p 'artifacts/${{ matrix.binary }}' | grep -E 'GLIBC_2\.([3-9][0-9]|29)'; then
            echo 'The binary requires glibc newer than 2.28.'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: artifacts/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Package and publish prcli
    needs: build-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Setup npm with Trusted Publisher support
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare release version
        id: version
        run: bun scripts/prepare-npm-release.js

      - name: Build Patchright daemon
        run: bun run build:patchright

      - uses: actions/download-artifact@v4
        with:
          pattern: agent-browser-*
          path: bin
          merge-multiple: true

      - name: Check package and CLI
        run: |
          chmod +x bin/agent-browser-*
          rm -f bin/.install-method
          bun scripts/check-npm-package.js
          node bin/patchright-cli.js --version
          npm pack --json > /tmp/prcli-pack.json
          mkdir -p /tmp/prcli-install
          npm install --prefix /tmp/prcli-install "$(node -p "require('/tmp/prcli-pack.json')[0].filename")"
          /tmp/prcli-install/node_modules/.bin/prcli --version

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: prcli-*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Publish to npm
        if: inputs.dry-run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "prcli@$VERSION" version >/dev/null 2>&1; then
            echo "prcli@$VERSION is already published; skipping this retry."
          else
            npm publish --access public --tag latest
          fi

      - name: Confirm published version
        if: inputs.dry-run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm view "prcli@$VERSION" version
